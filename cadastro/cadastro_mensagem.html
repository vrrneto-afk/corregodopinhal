<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Mensagens – ADM</title>

<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#7b3f2a">
<link rel="stylesheet" href="../menu/menu.css">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCW-CuFDrOLO-dteckl_GrPTocmyS-IrzY",
  authDomain: "sitio-corrego-do-pinhal.firebaseapp.com",
  projectId: "sitio-corrego-do-pinhal"
});
</script>

<script>
window.PERMISSAO_PAGINA = { area: "adm", chave: "cadastro_mensagem" };
</script>

<script src="../login/auth-guard.js"></script>

<style>
:root{
  --marrom:#7b3f2a;
  --bege:#f6efe7;
  --verde:#2f6b2f;
  --vermelho:#b03a2e;
  --logo:#D0B485;
}
*{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto}
body{margin:0;background:var(--bege)}
header{background:var(--logo);padding:14px;text-align:center;font-weight:800}
.container{max-width:720px;margin:16px auto;padding:16px;background:#fff;border-radius:12px}

label{font-weight:600;margin-top:10px;display:block}
input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc}
textarea{min-height:70px}
select[multiple]{min-height:90px}

button{width:100%;padding:12px;margin-top:14px;border:none;border-radius:10px;font-size:15px;cursor:pointer}
.salvar{background:var(--verde);color:#fff}
.excluir{background:var(--vermelho);color:#fff}
.cancelar{background:#999;color:#fff}

.card{
  border:1px solid #ddd;
  border-radius:12px;
  padding:14px;
  margin-top:14px;
  background:#fafafa;
}
.card h4{margin:0 0 6px 0}
.card small{color:#666}
.card p{margin:8px 0}

.actions{display:flex;gap:8px;margin-top:10px}
.actions button{flex:1}

.hidden{display:none}

/* ===== TABS ===== */
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab-btn{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:700;
  background:#e5e5e5;
  cursor:pointer;
}

  .linha {
  margin-top: 6px;
  font-size: 14px;
}

.linha.titulo {
  font-size: 16px;
  font-weight: 700;
}

.linha.data,
.linha.grupos {
  color: #555;
}

.linha.mensagem {
  margin-top: 10px;
  padding-top: 6px;
  border-top: 1px dashed #ddd;
}

.tab-btn.ativa{background:var(--marrom);color:#fff}
</style>
</head>

<body>

<header>🔔 Cadastro de Mensagens</header>
<div id="menu-adm"></div>

<div class="container">

<div class="tabs">
  <button class="tab-btn ativa" onclick="abrirAba('manuais',this)">📢 Manuais</button>
  <button class="tab-btn" onclick="abrirAba('automaticas',this)">⚙️ Automáticas</button>
</div>

<!-- ================= ABA MANUAIS ================= -->
<div id="aba-manuais">

<label>Data</label>
<input type="date" id="m_data">

<label>Horário</label>
<input type="time" id="m_hora">

<label>Grupo de usuários</label>
<select id="m_grupos" multiple></select>

<label>Título</label>
<input id="m_titulo">

<label>Mensagem</label>
<textarea id="m_texto"></textarea>

<button class="salvar" onclick="salvarManual()">💾 Salvar</button>
<button class="cancelar hidden" id="btnCancelarManual" onclick="cancelarManual()">↩️ Cancelar</button>

<div id="listaManuais"></div>
</div>

<!-- ================= ABA AUTOMÁTICAS ================= -->
<div id="aba-automaticas" class="hidden">

<label>Horário</label>
<select id="a_horario"></select>

<label>Tipo da mensagem</label>
<select id="a_tipo"></select>

<label>Grupo de usuários</label>
<select id="a_grupos" multiple></select>

<label>Mensagem (template)</label>
<textarea id="a_texto"></textarea>

<label>
  <input type="checkbox" id="a_ativo" checked> Ativa
</label>

<button class="salvar" onclick="salvarAutomatica()">💾 Salvar</button>
<button class="cancelar hidden" id="btnCancelarAuto" onclick="cancelarAutomatica()">↩️ Cancelar</button>

<div id="listaAutomaticas"></div>
</div>

</div>

<script>
/* ===== MENU ===== */
fetch("../menu/menu-adm.html")
.then(r=>r.text())
.then(html=>{
  document.getElementById("menu-adm").innerHTML = html;
  document.querySelectorAll(".menu-link").forEach(a=>{
    if(a.getAttribute("href")?.includes("cadastro_mensagem")){
      a.classList.add("ativo");
    }
  });
  const s=document.createElement("script");
  s.src="../menu/menu-permissoes.js";
  document.body.appendChild(s);
});

const db = firebase.firestore();

/* ===== ESTADO ===== */
let modoManual="novo", manualAtual=null;
let modoAuto="novo", autoAtual=null;

/* ===== TABS ===== */
function abrirAba(aba, btn){
  document.getElementById("aba-manuais").classList.toggle("hidden", aba!=="manuais");
  document.getElementById("aba-automaticas").classList.toggle("hidden", aba!=="automaticas");
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("ativa"));
  btn.classList.add("ativa");
}

/* ===== CONFIG ===== */
async function carregarGrupos(){
  const snap = await db.collection("config").doc("grupos").get();
  const lista = snap.data()?.lista || [];
  m_grupos.innerHTML=""; a_grupos.innerHTML="";
  lista.forEach(g=>{
    m_grupos.innerHTML+=`<option value="${g.id}">${g.nome}</option>`;
    a_grupos.innerHTML+=`<option value="${g.id}">${g.nome}</option>`;
  });
}

async function carregarConfigMensagem(){
  const h = await db.collection("config").doc("notificacoes_horarios").get();
  const t = await db.collection("config").doc("notificacoes_tipos").get();
  a_horario.innerHTML=""; a_tipo.innerHTML="";
  (h.data()?.lista||[]).forEach(x=>a_horario.innerHTML+=`<option>${x}</option>`);
  (t.data()?.lista||[]).forEach(x=>a_tipo.innerHTML+=`<option value="${x.id}">${x.nome}</option>`);
}

function formatarDataHora(dataISO, hora) {
  if (!dataISO || !hora) return "";

  const [ano, mes, dia] = dataISO.split("-");

  return `🕒 ${dia}/${mes}/${ano} às ${hora}`;
}

function formatarHorario(hora) {
  if (!hora) return "";
  return `🕒 Todos os dias às ${hora}`;
}


/* ===== MANUAIS ===== */
async function salvarManual(){
  if(!m_data.value||!m_hora.value||!m_titulo.value||!m_texto.value)
    return alert("Preencha todos os campos.");
  const dados={
    data_envio:m_data.value,
    horario_envio:m_hora.value,
    grupos:[...m_grupos.selectedOptions].map(o=>o.value),
    titulo:m_titulo.value,
    mensagem:m_texto.value,
    atualizado_em:firebase.firestore.FieldValue.serverTimestamp()
  };
  if(modoManual==="novo"){
    dados.criado_em=firebase.firestore.FieldValue.serverTimestamp();
    await db.collection("notificacoes_manuais").add(dados);
  }else{
    await db.collection("notificacoes_manuais").doc(manualAtual.id).update(dados);
  }
  cancelarManual(); listarManuais();
}

async function listarManuais(){
  listaManuais.innerHTML="";
  const snap=await db.collection("notificacoes_manuais").orderBy("criado_em","desc").get();
  snap.forEach(d=>{
    const m=d.data();
    listaManuais.innerHTML += `
  <div class="card">

    <div class="linha titulo">
      <strong>${m.titulo}</strong>
    </div>

    <div class="linha data">
      ${formatarDataHora(m.data_envio, m.horario_envio)}
    </div>

    <div class="linha grupos">
      👥 ${m.grupos.join(", ")}
    </div>

    <div class="linha mensagem">
      ${m.mensagem}
    </div>

    <div class="actions">
      <button onclick="editarManual('${d.id}')">✏️ Editar</button>
      <button class="excluir" onclick="excluirManual('${d.id}')">🗑️ Excluir</button>
    </div>

  </div>
`;
  });
}

async function editarManual(id){
  const d=await db.collection("notificacoes_manuais").doc(id).get();
  manualAtual={id,...d.data()};
  modoManual="editar";
  m_data.value=manualAtual.data_envio;
  m_hora.value=manualAtual.horario_envio;
  m_titulo.value=manualAtual.titulo;
  m_texto.value=manualAtual.mensagem;
  [...m_grupos.options].forEach(o=>o.selected=manualAtual.grupos.includes(o.value));
  btnCancelarManual.classList.remove("hidden");
}

async function excluirManual(id){
  if(confirm("Excluir notificação manual?")){
    await db.collection("notificacoes_manuais").doc(id).delete();
    listarManuais();
  }
}

function cancelarManual(){
  modoManual="novo"; manualAtual=null;
  m_data.value=""; m_hora.value=""; m_titulo.value=""; m_texto.value="";
  [...m_grupos.options].forEach(o=>o.selected=false);
  btnCancelarManual.classList.add("hidden");
}

/* ===== AUTOMÁTICAS ===== */
async function salvarAutomatica(){
  if(!a_horario.value||!a_tipo.value)
    return alert("Selecione horário e tipo.");
  const dados={
    ativo:a_ativo.checked,
    horario_id:a_horario.value,
    tipo_id:a_tipo.value,
    grupos:[...a_grupos.selectedOptions].map(o=>o.value),
    mensagem_template:a_texto.value,
    atualizado_em:firebase.firestore.FieldValue.serverTimestamp()
  };
  if(modoAuto==="novo"){
    dados.criado_em=firebase.firestore.FieldValue.serverTimestamp();
    await db.collection("notificacoes_automaticas").add(dados);
  }else{
    await db.collection("notificacoes_automaticas").doc(autoAtual.id).update(dados);
  }
  cancelarAutomatica(); listarAutomaticas();
}

async function listarAutomaticas(){
  listaAutomaticas.innerHTML="";
  const snap=await db.collection("notificacoes_automaticas").orderBy("criado_em","desc").get();
  snap.forEach(d=>{
    const a=d.data();
   listaAutomaticas.innerHTML += `
  <div class="card">

    <div class="linha titulo">
      ${a.tipo_id}
    </div>

    <div class="linha data">
     ${formatarHorario(a.horario_id)}
    </div>

    <div class="linha grupos">
      👥 ${a.grupos.join(", ")}
    </div>

    <div class="linha mensagem">
      ${a.mensagem_template}
    </div>

    <div class="actions">
      <button onclick="editarAutomatica('${d.id}')">✏️ Editar</button>
      <button class="excluir" onclick="excluirAutomatica('${d.id}')">🗑️ Excluir</button>
    </div>

  </div>
`;
  });
}

async function editarAutomatica(id){
  const d=await db.collection("notificacoes_automaticas").doc(id).get();
  autoAtual={id,...d.data()};
  modoAuto="editar";
  a_horario.value=autoAtual.horario_id;
  a_tipo.value=autoAtual.tipo_id;
  a_texto.value=autoAtual.mensagem_template;
  a_ativo.checked=autoAtual.ativo;
  [...a_grupos.options].forEach(o=>o.selected=autoAtual.grupos.includes(o.value));
  btnCancelarAuto.classList.remove("hidden");
}

async function excluirAutomatica(id){
  if(confirm("Excluir notificação automática?")){
    await db.collection("notificacoes_automaticas").doc(id).delete();
    listarAutomaticas();
  }
}

function cancelarAutomatica(){
  modoAuto="novo"; autoAtual=null;
  a_texto.value="";
  [...a_grupos.options].forEach(o=>o.selected=false);
  btnCancelarAuto.classList.add("hidden");
}

/* ===== INIT ===== */
carregarGrupos();
carregarConfigMensagem();
listarManuais();
listarAutomaticas();
</script>

<script src="../login/logout.js"></script>
</body>
</html>
