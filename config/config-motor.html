<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Motor de Mensagens – ADM</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCW-CuFDrOLO-dteckl_GrPTocmyS-IrzY",
  authDomain: "sitio-corrego-do-pinhal.firebaseapp.com",
  projectId: "sitio-corrego-do-pinhal"
});
</script>

<style>
body{font-family:system-ui;background:#f6efe7;padding:20px}
button{padding:12px;font-size:15px}
pre{background:#fff;padding:12px;border-radius:8px;margin-top:10px;white-space:pre-wrap}
</style>
</head>

<body>

<h2>⚙️ Motor de Mensagens</h2>
<button onclick="rodarMotor()">▶️ Executar Motor</button>

<pre id="log"></pre>

<script>
const db = firebase.firestore();
const logEl = document.getElementById("log");
const log = msg => logEl.textContent += msg + "\n";

/* ======================================================
   UTILITÁRIOS
====================================================== */
function horaAtual(){
  return new Date().toTimeString().slice(0,5);
}

function dataHoje(){
  return new Date().toISOString().split("T")[0];
}

function aplicarTemplate(texto, variaveis = {}){
  let r = texto;
  Object.keys(variaveis).forEach(k=>{
    r = r.replaceAll(`{${k}}`, variaveis[k] ?? "");
  });
  return r;
}

/* ======================================================
   🔒 ANTI-SPAM
====================================================== */
async function jaEnviadoHoje({ tipo_id, referencia }){
  const inicio = new Date();
  inicio.setHours(0,0,0,0);

  const fim = new Date();
  fim.setHours(23,59,59,999);

  const snap = await db
    .collection("log_notificacoes")
    .where("tipo_id","==",tipo_id)
    .where("referencia","==",referencia)
    .where("data_envio",">=",inicio)
    .where("data_envio","<=",fim)
    .limit(1)
    .get();

  return !snap.empty;
}

/* ======================================================
   HISTÓRICO
====================================================== */
async function registrarHistorico({
  tipo_id,
  grupos,
  mensagem,
  referencia
}){
  await db.collection("log_notificacoes").add({
    tipo_id,
    grupos,
    mensagem,
    referencia,
    origem: "motor",
    data_envio: firebase.firestore.FieldValue.serverTimestamp()
  });
}

/* ======================================================
   PROCESSADOR CENTRAL
====================================================== */
async function processarMensagemAutomatica({
  tipo_id,
  variaveis,
  referencia
}){
  const agora = horaAtual();

  // 🔒 BLOQUEIO ANTI-SPAM
  if(await jaEnviadoHoje({ tipo_id, referencia })){
    log(`⏭️ Ignorado (anti-spam): ${tipo_id} | ref ${referencia}`);
    return;
  }

  const snap = await db
    .collection("notificacoes_automaticas")
    .where("ativo","==",true)
    .where("tipo_id","==",tipo_id)
    .get();

  for(const doc of snap.docs){
    const cfg = doc.data();

    if(cfg.horario_hora !== agora) continue;

    const mensagemFinal = aplicarTemplate(
      cfg.mensagem_template,
      variaveis
    );

    log(
      `📤 ENVIO (${tipo_id})\n` +
      `👥 ${cfg.grupos.join(", ")}\n` +
      `${mensagemFinal}\n`
    );

    await registrarHistorico({
      tipo_id,
      grupos: cfg.grupos,
      mensagem: mensagemFinal,
      referencia
    });
  }
}

/* ======================================================
   MOTOR PRINCIPAL
====================================================== */
async function rodarMotor(){
  logEl.textContent = "";
  log("🔄 Iniciando motor...");

  await motorVacinas();
  await motorEventos();
  await motorEstoque();
  await motorAniversarios();
  await motorEstadoParto();

  log("✅ Motor finalizado");
}

/* ======================================================
   VACINAS
====================================================== */
async function motorVacinas(){
  log("💉 Verificando vacinas...");
  const hoje = dataHoje();
  const snap = await db.collection("vacinas").get();

  for(const d of snap.docs){
    const v = d.data();
    if(!v.data_proxima_dose) continue;

    if(v.data_proxima_dose < hoje){
      await processarMensagemAutomatica({
        tipo_id: "VACINA_ATRASADA",
        referencia: d.id,
        variaveis: {
          nome_animal: v.nome_animal,
          nome_vacina: v.nome_vacina
        }
      });
    }

    if(v.data_proxima_dose === hoje){
      await processarMensagemAutomatica({
        tipo_id: "VACINA_VENCE_HOJE",
        referencia: d.id,
        variaveis: {
          nome_animal: v.nome_animal,
          nome_vacina: v.nome_vacina
        }
      });
    }
  }
}

/* ======================================================
   EVENTOS (LOG POR ENQUANTO)
====================================================== */
async function motorEventos(){
  log("📅 Verificando eventos...");
  const hoje = new Date().toISOString().split("T")[0];

  const eventos = await db
    .collection("eventos")
    .where("ativo","==",true)
    .get();

  eventos.forEach(d=>{
    if(d.data().data_evento === hoje){
      log(`📌 Evento hoje: ${d.data().titulo}`);
    }
  });
}

/* ======================================================
   ESTOQUE (LOG)
====================================================== */
async function motorEstoque(){
  log("📦 Verificando estoque...");
  const itens = await db.collection("farmacia").get();

  itens.forEach(d=>{
    if(d.data().estoque_atual <= 0){
      log(`🚨 Estoque zerado: ${d.data().nome}`);
    }
  });
}

/* ======================================================
   ANIVERSÁRIOS (LOG)
====================================================== */
async function motorAniversarios(){
  log("🎂 Verificando aniversários...");
  const hoje = new Date();
  const dia = hoje.getDate();
  const mes = hoje.getMonth() + 1;

  const snap = await db.collection("config").doc("aniversarios").get();
  (snap.data()?.lista || []).forEach(a=>{
    if(a.ativo && a.dia === dia && a.mes === mes){
      log(`🎉 Aniversário de ${a.nome}`);
    }
  });
}

/* ======================================================
   🔴 MOTOR DE ESTADO — PARTO (INTEGRADO)
====================================================== */
async function motorEstadoParto(){
  log("🐄 Motor de estado — parto");

  const snapVacas = await db
    .collection("vacas")
    .where("ativo","==",true)
    .get();

  for(const doc of snapVacas.docs){
    const v = doc.data();
    const id = doc.id;

    if(!v.status_parto) continue;

    const estadoRef = db.collection("motor_estado_parto").doc(id);
    const estadoSnap = await estadoRef.get();

    const ultimo = estadoSnap.exists ? estadoSnap.data().ultimo_status : null;

    if(!ultimo){
      await estadoRef.set({
        vaca_id: id,
        ultimo_status: v.status_parto,
        atualizado_em: firebase.firestore.FieldValue.serverTimestamp()
      });
      log(`📌 Estado inicial: ${v.nome} → ${v.status_parto}`);
      continue;
    }

    if(ultimo !== v.status_parto){
      log(`🪧 PARTO: ${v.nome} (${ultimo} → ${v.status_parto})`);

      await processarMensagemAutomatica({
        tipo_id: "PARTO_MUDANCA_STATUS",
        referencia: id,
        variaveis: {
          nome_animal: v.nome,
          status_anterior: ultimo,
          status_atual: v.status_parto,
          mensagem_auxiliar: v.mensagem_auxiliar || ""
        }
      });

      await estadoRef.update({
        ultimo_status: v.status_parto,
        atualizado_em: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
  }
}
</script>

</body>
</html>
