<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuração de Mensagens – ADM</title>

<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#7b3f2a">
<link rel="stylesheet" href="../menu/menu.css">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCW-CuFDrOLO-dteckl_GrPTocmyS-IrzY",
  authDomain: "sitio-corrego-do-pinhal.firebaseapp.com",
  projectId: "sitio-corrego-do-pinhal"
});
</script>

<script>
window.PERMISSAO_PAGINA = { area:"config", chave:"config_mensagem" };
</script>

<script src="../login/auth-guard.js"></script>

<style>
:root{
  --marrom:#7b3f2a;
  --bege:#f6efe7;
  --verde:#2f6b2f;
  --vermelho:#b03a2e;
  --logo:#D0B485;
}
*{box-sizing:border-box;font-family:system-ui}
body{margin:0;background:var(--bege)}
header{background:var(--logo);padding:14px;text-align:center;font-weight:800}

.container{max-width:720px;margin:16px auto;padding:16px;background:#fff;border-radius:12px}

.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab-btn{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:700;
  background:#e5e5e5;
  cursor:pointer;
}
.tab-btn.ativa{background:var(--marrom);color:#fff}

label{font-weight:600;margin-top:10px;display:block}
input{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc}

button{
  width:100%;
  padding:12px;
  margin-top:14px;
  border:none;
  border-radius:10px;
  font-size:15px;
  cursor:pointer
}
.salvar{background:var(--verde);color:#fff}
.excluir{background:var(--vermelho);color:#fff}
.cancelar{background:#999;color:#fff}

.card{
  border:1px solid #ddd;
  border-radius:12px;
  padding:14px;
  margin-top:14px;
  background:#fafafa;
}

.linha{margin-top:6px;font-size:14px}
.linha.titulo{font-weight:700}

.actions{display:flex;gap:8px;margin-top:10px}
.actions button{flex:1}

.hidden{display:none}
</style>
</head>

<body>

<header>⚙️ Configuração de Mensagens</header>
<div id="menu-adm"></div>

<div class="container">

<div class="tabs">
  <button class="tab-btn ativa" onclick="abrirAba('horarios',this)">⏰ Horários</button>
  <button class="tab-btn" onclick="abrirAba('tipos',this)">🏷️ Tipos</button>
</div>

<!-- ================= HORÁRIOS ================= -->
<div id="aba-horarios">

<label>Nome do horário</label>
<input id="h_nome" placeholder="Ex: Manhã">

<label>Hora</label>
<input type="time" id="h_hora">

<label>
  <input type="checkbox" id="h_ativo" checked> Ativo
</label>

<button class="salvar" onclick="salvarHorario()">💾 Salvar</button>
<button class="cancelar hidden" id="btnCancelarHorario" onclick="cancelarHorario()">↩️ Cancelar</button>

<div id="listaHorarios"></div>
</div>

<!-- ================= TIPOS ================= -->
<div id="aba-tipos" class="hidden">

<label>Nome do tipo de mensagem</label>
<input id="t_nome" placeholder="Ex: Vacinas atrasadas">

<label>
  <input type="checkbox" id="t_ativo" checked> Ativo
</label>

<button class="salvar" onclick="salvarTipo()">💾 Salvar</button>
<button class="cancelar hidden" id="btnCancelarTipo" onclick="cancelarTipo()">↩️ Cancelar</button>

<div id="listaTipos"></div>
</div>

</div>

<script>
const db = firebase.firestore();

/* ======================================================
   MENU ADM – PADRÃO DEFINITIVO
   ====================================================== */
fetch("../menu/menu-adm.html")
  .then(r => r.text())
  .then(html => {
    document.getElementById("menu-adm").innerHTML = html;

    document.querySelectorAll(".menu-link").forEach(a=>{
      if(a.getAttribute("href")?.includes("config.html")){
        a.classList.add("ativo");
      }
    });

    const s = document.createElement("script");
    s.src = "../menu/menu-permissoes.js";
    s.onload = () => {
      document.body.style.display = "block";
      carregar();
    };
    document.body.appendChild(s);
  });

/* ===== TABS ===== */
function abrirAba(aba, btn){
  document.getElementById("aba-horarios").classList.toggle("hidden", aba!=="horarios");
  document.getElementById("aba-tipos").classList.toggle("hidden", aba!=="tipos");
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("ativa"));
  btn.classList.add("ativa");
}

/* ===== HORÁRIOS ===== */
let horarioEditando = null;

async function salvarHorario(){
  if(!h_nome.value || !h_hora.value) return alert("Preencha os campos.");

  const ref = db.collection("config").doc("notificacoes_horarios");
  const snap = await ref.get();
  let lista = snap.data()?.lista || [];

  if(horarioEditando){
    lista = lista.map(h =>
      h.id === horarioEditando.id
        ? {...h, nome:h_nome.value, hora:h_hora.value, ativo:h_ativo.checked}
        : h
    );
  }else{
    lista.push({
      id: crypto.randomUUID(),
      nome: h_nome.value,
      hora: h_hora.value,
      ativo: h_ativo.checked
    });
  }

  await ref.set({lista});
  cancelarHorario();
  listarHorarios();
}

async function listarHorarios(){
  listaHorarios.innerHTML="";
  const snap = await db.collection("config").doc("notificacoes_horarios").get();
  (snap.data()?.lista||[]).forEach(h=>{
    listaHorarios.innerHTML+=`
      <div class="card">
        <div class="linha titulo">${h.nome} – ${h.hora}</div>
        <div class="linha">${h.ativo?"🟢 Ativo":"🔴 Inativo"}</div>
        <div class="actions">
          <button onclick='editarHorario(${JSON.stringify(h)})'>✏️ Editar</button>
        </div>
      </div>`;
  });
}

function editarHorario(h){
  horarioEditando = h;
  h_nome.value = h.nome;
  h_hora.value = h.hora;
  h_ativo.checked = h.ativo;
  btnCancelarHorario.classList.remove("hidden");
}

function cancelarHorario(){
  horarioEditando=null;
  h_nome.value=""; h_hora.value=""; h_ativo.checked=true;
  btnCancelarHorario.classList.add("hidden");
}

/* ===== TIPOS ===== */
let tipoEditando=null;

async function salvarTipo(){
  if(!t_nome.value) return alert("Informe o nome.");

  const ref = db.collection("config").doc("notificacoes_tipos");
  const snap = await ref.get();
  let lista = snap.data()?.lista || [];

  if(tipoEditando){
    lista = lista.map(t =>
      t.id === tipoEditando.id
        ? {...t, nome:t_nome.value, ativo:t_ativo.checked}
        : t
    );
  }else{
    lista.push({
      id: crypto.randomUUID(),
      nome: t_nome.value,
      ativo: t_ativo.checked
    });
  }

  await ref.set({lista});
  cancelarTipo();
  listarTipos();
}

async function listarTipos(){
  listaTipos.innerHTML="";
  const snap = await db.collection("config").doc("notificacoes_tipos").get();
  (snap.data()?.lista||[]).forEach(t=>{
    listaTipos.innerHTML+=`
      <div class="card">
        <div class="linha titulo">${t.nome}</div>
        <div class="linha">${t.ativo?"🟢 Ativo":"🔴 Inativo"}</div>
        <div class="actions">
          <button onclick='editarTipo(${JSON.stringify(t)})'>✏️ Editar</button>
        </div>
      </div>`;
  });
}

function editarTipo(t){
  tipoEditando=t;
  t_nome.value=t.nome;
  t_ativo.checked=t.ativo;
  btnCancelarTipo.classList.remove("hidden");
}

function cancelarTipo(){
  tipoEditando=null;
  t_nome.value=""; t_ativo.checked=true;
  btnCancelarTipo.classList.add("hidden");
}

/* ===== INIT ===== */
listarHorarios();
listarTipos();
</script>

<script src="../login/logout.js"></script>
</body>
</html>
