<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Motor de Mensagens – ADM</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCW-CuFDrOLO-dteckl_GrPTocmyS-IrzY",
  authDomain: "sitio-corrego-do-pinhal.firebaseapp.com",
  projectId: "sitio-corrego-do-pinhal"
});
</script>

<style>
body{font-family:system-ui;background:#f6efe7;padding:20px}
button{padding:12px;font-size:15px}
pre{background:#fff;padding:12px;border-radius:8px;margin-top:10px}
</style>
</head>

<body>

<h2>⚙️ Motor de Mensagens</h2>
<button onclick="rodarMotor()">▶️ Executar Motor</button>

<pre id="log"></pre>

<script>
const db = firebase.firestore();
const log = msg => document.getElementById("log").textContent += msg + "\n";

async function rodarMotor(){
  document.getElementById("log").textContent = "";
  log("🔄 Iniciando motor...");

  await motorVacinas();
  await motorParto();
  await motorEventos();
  await motorEstoque();
  await motorAniversarios();

  log("✅ Motor finalizado");
}

/* ===== VACINAS ===== */
async function motorVacinas(){
  log("💉 Verificando vacinas...");
  const hoje = new Date().toISOString().split("T")[0];
  const snap = await db.collection("vacinas").get();

  snap.forEach(d=>{
    const v = d.data();
    if(v.data_proxima_dose < hoje){
      log(`🚨 Vacina atrasada: ${v.nome_animal} - ${v.nome_vacina}`);
    }
    if(v.data_proxima_dose === hoje){
      log(`💉 Vacina vence hoje: ${v.nome_animal}`);
    }
  });
}

/* ===== PARTO ===== */
async function motorParto(){
  log("🐄 Verificando partos...");
  const vacas = await db.collection("vacas").where("ativo","==",true).get();

  for(const d of vacas.docs){
    const v = d.data();
    const estadoRef = db.collection("motor_estado_parto").doc(d.id);
    const estadoSnap = await estadoRef.get();
    const ultimo = estadoSnap.exists ? estadoSnap.data().ultimo_status : null;

    if(ultimo !== v.status_parto){
      log(`🪧 ${v.nome} mudou para ${v.status_parto}`);
      await estadoRef.set({ultimo_status:v.status_parto});
    }
  }
}

/* ===== EVENTOS ===== */
async function motorEventos(){
  log("📅 Verificando eventos...");
  const hoje = new Date().toISOString().split("T")[0];
  const eventos = await db.collection("eventos").where("ativo","==",true).get();

  eventos.forEach(d=>{
    if(d.data().data_evento === hoje){
      log(`📌 Evento hoje: ${d.data().titulo}`);
    }
  });
}

/* ===== ESTOQUE ===== */
async function motorEstoque(){
  log("📦 Verificando estoque...");
  const itens = await db.collection("farmacia").get();

  itens.forEach(d=>{
    const i = d.data();
    if(i.estoque_atual <= 0){
      log(`🚨 Estoque zerado: ${i.nome}`);
    }
  });
}

/* ===== ANIVERSÁRIOS ===== */
async function motorAniversarios(){
  log("🎂 Verificando aniversários...");
  const hoje = new Date();
  const dia = hoje.getDate();
  const mes = hoje.getMonth()+1;

  const snap = await db.collection("config").doc("aniversarios").get();
  (snap.data()?.lista||[]).forEach(a=>{
    if(a.ativo && a.dia === dia && a.mes === mes){
      log(`🎉 Aniversário de ${a.nome}`);
    }
  });
}
</script>

</body>
</html>
