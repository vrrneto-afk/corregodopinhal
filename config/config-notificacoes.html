<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerenciamento de Notificações – Sistema</title>

<!-- MANIFEST -->
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#7b3f2a">

<!-- MENU GLOBAL -->
<link rel="stylesheet" href="../menu/menu.css">

<!-- CONFIG CSS (Reutilizando estilos de componentes e tabelas) -->
<link rel="stylesheet" href="../menu/components.css">
<link rel="stylesheet" href="../menu/forms.css">
<link rel="stylesheet" href="../menu/tables.css">

<!-- FIREBASE SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>

<!-- CONFIGURAÇÃO CENTRALIZADA -->
<script src="../js/firebase-config.js"></script>

<!-- IDENTIFICAÇÃO DA PÁGINA PARA O AUTH GUARD -->
<script>
window.PERMISSAO_PAGINA = {
  area: "config",
  chave: "config-notificacoes"
};
</script>

<!-- AUTH GUARD -->
<script src="../login/auth-guard.js"></script>

<style>
  :root {
    --marrom: #7b3f2a;
    --bege: #f6efe7;
    --verde: #2f6b2f;
    --logo: #D0B485;
  }

  body {
    margin: 0;
    background: var(--bege);
    color: #333;
    display: none; /* Liberado pelo auth-guard */
  }

  header {
    background: var(--logo);
    padding: 15px;
    text-align: center;
    font-weight: 800;
    color: var(--marrom);
  }

  .container {
    max-width: 900px;
    margin: 20px auto;
    padding: 0 15px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 768px) {
    .grid { grid-template-columns: 1fr; }
  }

  .card {
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    margin-bottom: 20px;
  }

  .card h2 {
    margin-top: 0;
    font-size: 18px;
    color: var(--marrom);
    border-bottom: 2px solid var(--bege);
    padding-bottom: 10px;
    margin-bottom: 15px;
  }

  .form-group { margin-bottom: 15px; }
  label { display: block; font-weight: 700; margin-bottom: 5px; font-size: 14px; }
  input, textarea, select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
  }
  
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-weight: 800;
    cursor: pointer;
    color: #fff;
  }
  .btn-verde { background: var(--verde); }
  .btn-marrom { background: var(--marrom); }

  /* Estilo para os Toggles de Automação */
  .auto-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
  }
  .auto-item:last-child { border-bottom: none; }
  
  .switch {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 22px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #ccc;
    transition: .4s;
    border-radius: 22px;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 16px; width: 16px;
    left: 3px; bottom: 3px;
    background-color: white;
    transition: .4s;
    border-radius: 50%;
  }
  input:checked + .slider { background-color: var(--verde); }
  input:checked + .slider:before { transform: translateX(22px); }

  .horarios-grid {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
</style>
</head>

<body>

<header>📢 Central de Notificações</header>

<div id="menu-adm"></div>

<div class="container">
  
  <div class="grid">
    
    <!-- BLOCO 1: ENVIO MANUAL -->
    <div class="card">
      <h2>🚀 Envio Manual</h2>
      <div class="form-group">
        <label>Título da Mensagem</label>
        <input type="text" id="manual_titulo" placeholder="Ex: Reunião às 15h">
      </div>
      <div class="form-group">
        <label>Conteúdo da Notificação</label>
        <textarea id="manual_msg" rows="4" placeholder="Escreva aqui o aviso para todos os usuários..."></textarea>
      </div>
      <div class="form-group">
        <label>Enviar para:</label>
        <select id="manual_destino">
          <option value="todos">Todos os Dispositivos</option>
          <option value="admin">Apenas Administradores</option>
        </select>
      </div>
      <button class="btn btn-verde" onclick="enviarManual()">DISPARAR NOTIFICAÇÃO</button>
    </div>

    <!-- BLOCO 2: CONFIGURAÇÃO DE AUTOMAÇÕES -->
    <div class="card">
      <h2>⚙️ Automações Diárias</h2>
      
      <div class="auto-item">
        <span>💉 Vacinas Atrasadas</span>
        <label class="switch">
          <input type="checkbox" id="auto_vacinas" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="auto-item">
        <span>🐄 Previsão de Partos</span>
        <label class="switch">
          <input type="checkbox" id="auto_partos" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="auto-item">
        <span>🛒 Lista de Compras</span>
        <label class="switch">
          <input type="checkbox" id="auto_compras" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="auto-item">
        <span>⛈️ Alerta de Chuva</span>
        <label class="switch">
          <input type="checkbox" id="auto_clima" checked>
          <span class="slider"></span>
        </label>
      </div>

      <h2 style="margin-top: 25px; border:none">🕒 Horários de Verificação</h2>
      <div class="horarios-grid">
        <input type="time" id="h_manha" value="07:00">
        <input type="time" id="h_tarde" value="13:00">
        <input type="time" id="h_noite" value="19:00">
      </div>
      
      <button class="btn btn-marrom" style="margin-top: 20px;" onclick="salvarAutomacoes()">SALVAR CONFIGURAÇÕES</button>
    </div>

  </div>

  <!-- BLOCO 3: HISTÓRICO -->
  <div class="card">
    <h2>📜 Histórico de Envios</h2>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Data/Hora</th>
            <th>Título</th>
            <th>Tipo</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tabelaHistorico">
          <!-- Preenchido via JS -->
          <tr><td colspan="4" style="text-align:center">Carregando histórico...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- SCRIPTS DE LOGICA -->
<script>
  // Carrega o menu administrativo padrão
  fetch("../menu/menu-adm.html")
    .then(r => r.text())
    .then(html => {
      document.getElementById("menu-adm").innerHTML = html;
      // Ativa o link de configurações no menu
      document.querySelectorAll(".menu-link").forEach(a => {
        if(a.getAttribute("href")?.includes("config.html")) a.classList.add("ativo");
      });
    });

  // Referências do Firestore
  const db = window.db;

  // 1. Carregar Configurações Atuais
  async function carregarConfig() {
    const doc = await db.collection("config").doc("notificacoes").get();
    if (doc.exists) {
      const d = doc.data();
      document.getElementById("auto_vacinas").checked = d.auto_vacinas;
      document.getElementById("auto_partos").checked = d.auto_partos;
      document.getElementById("auto_compras").checked = d.auto_compras;
      document.getElementById("auto_clima").checked = d.auto_clima;
      document.getElementById("h_manha").value = d.h_manha || "07:00";
      document.getElementById("h_tarde").value = d.h_tarde || "13:00";
      document.getElementById("h_noite").value = d.h_noite || "19:00";
    }
    carregarHistorico();
  }

  // 2. Salvar Automações
  async function salvarAutomacoes() {
    try {
      await db.collection("config").doc("notificacoes").set({
        auto_vacinas: document.getElementById("auto_vacinas").checked,
        auto_partos: document.getElementById("auto_partos").checked,
        auto_compras: document.getElementById("auto_compras").checked,
        auto_clima: document.getElementById("auto_clima").checked,
        h_manha: document.getElementById("h_manha").value,
        h_tarde: document.getElementById("h_tarde").value,
        h_noite: document.getElementById("h_noite").value,
        ultima_atualizacao: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
      alert("Configurações de automação salvas!");
    } catch (e) {
      alert("Erro ao salvar: " + e.message);
    }
  }

  // 3. Enviar Notificação Manual
  async function enviarManual() {
    const titulo = document.getElementById("manual_titulo").value;
    const msg = document.getElementById("manual_msg").value;
    const destino = document.getElementById("manual_destino").value;

    if (!titulo || !msg) return alert("Preencha título e mensagem.");

    if (!confirm("Deseja disparar esta notificação agora?")) return;

    try {
      // Aqui salvamos na coleção 'notificacoes_pendentes'
      // Uma Cloud Function ou o Service Worker deve escutar esta coleção para disparar o FCM
      await db.collection("historico_notificacoes").add({
        titulo,
        mensagem: msg,
        destino,
        tipo: "Manual",
        data: firebase.firestore.FieldValue.serverTimestamp(),
        status: "Pendente",
        enviado_por: window.auth.currentUser.email
      });

      alert("Notificação enviada para a fila de processamento!");
      document.getElementById("manual_titulo").value = "";
      document.getElementById("manual_msg").value = "";
      carregarHistorico();
    } catch (e) {
      alert("Erro ao disparar: " + e.message);
    }
  }

  // 4. Carregar Histórico
  async function carregarHistorico() {
    const snap = await db.collection("historico_notificacoes")
      .orderBy("data", "desc")
      .limit(10)
      .get();
    
    const tbody = document.getElementById("tabelaHistorico");
    tbody.innerHTML = "";

    if (snap.empty) {
      tbody.innerHTML = "<tr><td colspan='4' style='text-align:center'>Nenhum registro encontrado.</td></tr>";
      return;
    }

    snap.forEach(doc => {
      const d = doc.data();
      const dataStr = d.data ? d.data.toDate().toLocaleString("pt-BR") : "---";
      tbody.innerHTML += `
        <tr>
          <td>${dataStr}</td>
          <td>${d.titulo}</td>
          <td>${d.tipo}</td>
          <td><span style="color:${d.status === 'Enviado' ? 'green' : 'orange'}">● ${d.status}</span></td>
        </tr>
      `;
    });
  }

  // Inicializa ao carregar
  document.addEventListener("permissoes-carregadas", carregarConfig);
</script>

<!-- LOGOUT GLOBAL -->
<script src="../login/logout.js"></script>

</body>
</html>
